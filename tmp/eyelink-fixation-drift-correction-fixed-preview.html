}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {

.btn:focus-visible {

}

svg {

  height: auto;

  const state = { epoch: &quot;all&quot;, raw: true, corrected: true };

  const svgNamespace = &quot;http://www.w3.org/2000/svg&quot;;

  function svgElement(tag, attributes = {}, text = null) {
    const element = document.createElementNS(svgNamespace, tag);
    Object.entries(attributes).forEach(([name, value]) =&gt; {
      if (value !== null &amp;&amp; value !== undefined) {
        element.setAttribute(name, String(value));
      }
    });
    if (text !== null) element.textContent = text;
    return element;
  }

  function appendSvg(parent, tag, attributes = {}, text = null) {
    const element = svgElement(tag, attributes, text);
    parent.appendChild(element);
    return element;
  }

  function scaleLinear(domainStart, domainEnd, rangeStart, rangeEnd) {
    const domainSpan = domainEnd - domainStart || 1;
    const rangeSpan = rangeEnd - rangeStart;
    const scale = value =&gt; rangeStart + (value - domainStart) * rangeSpan / domainSpan;
    scale.invert = value =&gt; domainStart + (value - rangeStart) * domainSpan / rangeSpan;
    return scale;
  }

  function median(values) {
    const sorted = [...values].sort((a, b) =&gt; a - b);
    const middle = Math.floor(sorted.length / 2);
    return sorted.length % 2 ? sorted[middle] : (sorted[middle - 1] + sorted[middle]) / 2;
  }

  function mean(values) {
    return values.reduce((sum, value) =&gt; sum + value, 0) / values.length;
  }

  function selectedData() {
    if (state.epoch === &quot;early&quot;) return data.filter(d =&gt; d.trial &lt; 41);
    if (state.epoch === &quot;transition&quot;) return data.filter(d =&gt; d.trial &gt;= 41 &amp;&amp; d.trial &lt; 69);
    if (state.epoch === &quot;drift&quot;) return data.filter(d =&gt; d.trial &gt;= 69);
    return data;
  }

  function showTooltip(event, d) {

      `实际刺激：(${d.stim_x.toFixed(0)}°, ${d.stim_y.toFixed(0)}°)`,
      `原始误差：(${d.raw_ex.toFixed(2)}°, ${d.raw_ey.toFixed(2)}°)，${d.raw_norm.toFixed(2)}°`,
      `修正误差：(${d.cor_ex.toFixed(2)}°, ${d.cor_ey.toFixed(2)}°)，${d.cor_norm.toFixed(2)}°`,
      `Fixation 偏差：(${d.fix_ex.toFixed(2)}°, ${d.fix_ey.toFixed(2)}°)`
    ];
    tooltip.innerHTML = lines.join(&quot;&lt;br&gt;&quot;);
    tooltip.style.display = &quot;block&quot;;
    tooltip.setAttribute(&quot;aria-hidden&quot;, &quot;false&quot;);
    const rootRect = root.getBoundingClientRect();
    const maxLeft = Math.max(4, rootRect.width - 292);
    tooltip.style.left = `${Math.max(4, Math.min(event.clientX - rootRect.left + 12, maxLeft))}px`;
    tooltip.style.top = `${event.clientY - rootRect.top + 12}px`;
  }

  function hideTooltip() {

  }

  function createChart(host, width, height, label, title, description) {
    host.replaceChildren();
    const svg = svgElement(&quot;svg&quot;, {

      role: &quot;img&quot;,

    appendSvg(svg, &quot;title&quot;, {}, title);
    appendSvg(svg, &quot;desc&quot;, {}, description);
    host.appendChild(svg);
    return svg;
  }

  function addCartesianAxes(plot, xScale, yScale, xTicks, yTicks, innerWidth, innerHeight, xFormat, yFormat) {
    const grid = appendSvg(plot, &quot;g&quot;, { class: &quot;grid&quot; });
    xTicks.forEach(value =&gt; {
      appendSvg(grid, &quot;line&quot;, {
        x1: xScale(value), x2: xScale(value), y1: 0, y2: innerHeight
      });
    });
    yTicks.forEach(value =&gt; {
      appendSvg(grid, &quot;line&quot;, {
        x1: 0, x2: innerWidth, y1: yScale(value), y2: yScale(value)
      });
    });
    appendSvg(plot, &quot;rect&quot;, {
      class: &quot;chart-frame&quot;,
      &quot;data-chart-frame&quot;: &quot;&quot;,
      width: innerWidth,
      height: innerHeight
    });

    const xAxis = appendSvg(plot, &quot;g&quot;, { class: &quot;axis&quot; });
    xTicks.forEach(value =&gt; {
      const position = xScale(value);
      appendSvg(xAxis, &quot;line&quot;, {
        x1: position, x2: position, y1: innerHeight, y2: innerHeight + 5
      });
      appendSvg(xAxis, &quot;text&quot;, {
        x: position, y: innerHeight + 20, &quot;text-anchor&quot;: &quot;middle&quot;
      }, xFormat(value));
    });

    const yAxis = appendSvg(plot, &quot;g&quot;, { class: &quot;axis&quot; });
    yTicks.forEach(value =&gt; {
      const position = yScale(value);
      appendSvg(yAxis, &quot;line&quot;, { x1: -5, x2: 0, y1: position, y2: position });
      appendSvg(yAxis, &quot;text&quot;, {
        x: -9, y: position + 4, &quot;text-anchor&quot;: &quot;end&quot;
      }, yFormat(value));
    });
  }

  function nicePairDomain(maxAbs) {
    const padded = Math.max(1, maxAbs * 1.14);
    const rawStep = padded / 3;
    const power = 10 ** Math.floor(Math.log10(rawStep));
    const normalized = rawStep / power;
    const factor = [1, 2, 2.5, 5, 10].find(value =&gt; value &gt;= normalized) || 10;
    const step = factor * power;
    return { bound: Math.ceil(padded / step) * step, step };
  }

  function drawPairPlot() {
    const shown = selectedData();
    const width = Math.max(320, pairHost.getBoundingClientRect().width);
    const height = width &lt; 520 ? 300 : 390;
    const margin = { top: 18, right: 22, bottom: 54, left: 68 };
    const innerWidth = width - margin.left - margin.right;
    const innerHeight = height - margin.top - margin.bottom;
    const allValues = shown.flatMap(d =&gt; [d.raw_ex, d.raw_ey, d.cor_ex, d.cor_ey]);
    const maxAbs = Math.max(...allValues.map(value =&gt; Math.abs(value)));
    const domain = nicePairDomain(maxAbs);
    const x = scaleLinear(-domain.bound, domain.bound, 0, innerWidth);
    const y = scaleLinear(-domain.bound, domain.bound, innerHeight, 0);
    const ticks = width &lt; 520
      ? [-domain.bound, 0, domain.bound]
      : Array.from(
          { length: Math.round((2 * domain.bound) / domain.step) + 1 },
          (_, index) =&gt; -domain.bound + index * domain.step
        );

    const svg = createChart(
      pairHost,
      width,
      height,
      &quot;成功 trial 的原始 gaze 和 fixation 偏差修正后 gaze，相对于各自刺激中心的配对散点图&quot;,
      &quot;刺激中心对齐后的配对 gaze 误差&quot;,
      &quot;所有刺激位置被平移到坐标原点。每条细线连接同一个成功 trial 修正前后的 gaze 位置。&quot;
    );
    const plot = appendSvg(svg, &quot;g&quot;, { transform: `translate(${margin.left},${margin.top})` });
    addCartesianAxes(
      plot, x, y, ticks, ticks, innerWidth, innerHeight,
      value =&gt; `${Number(value.toFixed(2))}°`,
      value =&gt; `${Number(value.toFixed(2))}°`
    );

    if (state.raw &amp;&amp; state.corrected) {

      shown.forEach(d =&gt; appendSvg(points, &quot;circle&quot;, {

      x: margin.left + innerWidth / 2, y: height - 8, &quot;text-anchor&quot;: &quot;middle&quot;
    }, &quot;相对 Stim 中心的水平误差 (°)&quot;);
    appendSvg(svg, &quot;text&quot;, {
      class: &quot;axis-title&quot;, &quot;data-axis&quot;: &quot;y&quot;,
      transform: `translate(17,${margin.top + innerHeight / 2}) rotate(-90)`,
      &quot;text-anchor&quot;: &quot;middle&quot;
    }, &quot;相对 Stim 中心的垂直误差 (°)&quot;);

    const overlay = appendSvg(plot, &quot;rect&quot;, {
      class: &quot;hit-overlay&quot;,
      &quot;data-chart-hit&quot;: &quot;&quot;,
      &quot;data-chart-hover-overlay&quot;: &quot;cross-series&quot;,
      width: innerWidth,
      height: innerHeight
    });
    overlay.addEventListener(&quot;mousemove&quot;, event =&gt; {
      const rectangle = overlay.getBoundingClientRect();
      const mx = (event.clientX - rectangle.left) * innerWidth / rectangle.width;
      const my = (event.clientY - rectangle.top) * innerHeight / rectangle.height;
      let nearest = null;
      let nearestDistance = Infinity;
      shown.forEach(d =&gt; {
        const candidates = [];
        if (state.raw) candidates.push([x(d.raw_ex), y(d.raw_ey)]);
        if (state.corrected) candidates.push([x(d.cor_ex), y(d.cor_ey)]);
        candidates.forEach(([px, py]) =&gt; {
          const distance = Math.hypot(px - mx, py - my);
          if (distance &lt; nearestDistance) {
            nearestDistance = distance;
            nearest = d;
          }
        });
      });
      if (nearest &amp;&amp; nearestDistance &lt; 28) showTooltip(event, nearest);
      else hideTooltip();
    });
    overlay.addEventListener(&quot;mouseleave&quot;, hideTooltip);

    const rawMedian = median(shown.map(d =&gt; d.raw_norm));
    const correctedMedian = median(shown.map(d =&gt; d.cor_norm));
    const improved = mean(shown.map(d =&gt; d.cor_norm &lt; d.raw_norm ? 1 : 0));
    root.querySelector(&quot;#eyelink-pair-summary&quot;).textContent =
      `${shown.length} 个 trial；误差中位数 ${rawMedian.toFixed(2)}° → ${correctedMedian.toFixed(2)}°；${Math.round(improved * 100)}% 的 trial 改善。`;
  }

  function drawTimePlot() {
    const width = Math.max(320, timeHost.getBoundingClientRect().width);
    const height = width &lt; 520 ? 260 : 300;
    const margin = { top: 24, right: 22, bottom: 52, left: 68 };
    const innerWidth = width - margin.left - margin.right;
    const innerHeight = height - margin.top - margin.bottom;
    const maxMinute = Math.max(...data.map(d =&gt; d.minute));
    const maxError = Math.max(...data.map(d =&gt; Math.max(Math.hypot(d.fix_ex, d.fix_ey), d.roll_fix_norm || 0)));
    const xMax = Math.ceil(maxMinute / 5) * 5;
    const yMax = Math.ceil(maxError * 1.12 * 2) / 2;
    const x = scaleLinear(0, xMax, 0, innerWidth);
    const y = scaleLinear(0, yMax, innerHeight, 0);
    const xTicks = width &lt; 520
      ? [0, 10, 20, 30].filter(value =&gt; value &lt;= xMax)
      : Array.from({ length: Math.floor(xMax / 5) + 1 }, (_, index) =&gt; index * 5);
    const yTicks = Array.from({ length: Math.floor(yMax / 0.5) + 1 }, (_, index) =&gt; index * 0.5);

    const svg = createChart(
      timeHost,
      width,
      height,
      &quot;Fixation gaze 偏差随任务分钟数变化的时间图&quot;,
      &quot;Fixation 偏差时间变化&quot;,
      &quot;约第 3.77 分钟出现主要均值变化，第 6.50 分钟起最近十五个成功 trial 的偏差持续超过一度。&quot;
    );
    const plot = appendSvg(svg, &quot;g&quot;, { transform: `translate(${margin.left},${margin.top})` });
    addCartesianAxes(
      plot, x, y, xTicks, yTicks, innerWidth, innerHeight,
      value =&gt; `${value} min`, value =&gt; `${Number(value.toFixed(1))}°`
    );
    appendSvg(plot, &quot;line&quot;, {
      class: &quot;threshold-line&quot;, x1: 0, x2: innerWidth, y1: y(1), y2: y(1)
    });
    appendSvg(plot, &quot;text&quot;, {
      class: &quot;annotation&quot;, x: innerWidth - 3, y: y(1) - 5, &quot;text-anchor&quot;: &quot;end&quot;
    }, &quot;1°&quot;);

    const validRolling = data.filter(d =&gt; d.roll_fix_norm !== null);
    const pathData = validRolling.map((d, index) =&gt; {
      const command = index === 0 ? &quot;M&quot; : &quot;L&quot;;
      return `${command} ${x(d.minute).toFixed(2)} ${y(d.roll_fix_norm).toFixed(2)}`;
    }).join(&quot; &quot;);
    appendSvg(plot, &quot;path&quot;, { class: &quot;rolling-line&quot;, d: pathData });
    const points = appendSvg(plot, &quot;g&quot;);
    data.forEach(d =&gt; appendSvg(points, &quot;circle&quot;, {
      class: &quot;fix-point&quot;, r: 2.5,
      cx: x(d.minute), cy: y(Math.hypot(d.fix_ex, d.fix_ey))
    }));

    const markers = [
      { minute: 3.773, label: &quot;均值变化 3.77 min&quot;, className: &quot;change-line&quot; },
      { minute: 6.504, label: &quot;持续 &gt;1° 6.50 min&quot;, className: &quot;sustained-line&quot; }
    ];
    markers.forEach((marker, index) =&gt; {
      appendSvg(plot, &quot;line&quot;, {
        class: marker.className,
        x1: x(marker.minute), x2: x(marker.minute), y1: 0, y2: innerHeight
      });
      appendSvg(plot, &quot;text&quot;, {
        class: &quot;annotation&quot;, x: x(marker.minute) + 5, y: 13 + index * 16,
        &quot;text-anchor&quot;: &quot;start&quot;
      }, marker.label);
    });

    appendSvg(svg, &quot;text&quot;, {
      class: &quot;axis-title&quot;, &quot;data-axis&quot;: &quot;x&quot;,
      x: margin.left + innerWidth / 2, y: height - 7, &quot;text-anchor&quot;: &quot;middle&quot;
    }, &quot;任务开始后的时间 (min)&quot;);
    appendSvg(svg, &quot;text&quot;, {
      class: &quot;axis-title&quot;, &quot;data-axis&quot;: &quot;y&quot;,
      transform: `translate(17,${margin.top + innerHeight / 2}) rotate(-90)`,
      &quot;text-anchor&quot;: &quot;middle&quot;
    }, &quot;Fixation gaze 相对目标的偏差 (°)&quot;);

    const overlay = appendSvg(plot, &quot;rect&quot;, {
      class: &quot;hit-overlay&quot;,
      &quot;data-chart-hit&quot;: &quot;&quot;,
      &quot;data-chart-hover-overlay&quot;: &quot;cross-series&quot;,
      width: innerWidth,
      height: innerHeight
    });
    overlay.addEventListener(&quot;mousemove&quot;, event =&gt; {
      const rectangle = overlay.getBoundingClientRect();
      const mx = (event.clientX - rectangle.left) * innerWidth / rectangle.width;
      const minute = x.invert(mx);
      let nearest = data[0];
      let bestDistance = Math.abs(nearest.minute - minute);
      for (let index = 1; index &lt; data.length; index += 1) {
        const distance = Math.abs(data[index].minute - minute);
        if (distance &lt; bestDistance) {
          nearest = data[index];
          bestDistance = distance;
        }
      }
      showTooltip(event, nearest);
    });
    overlay.addEventListener(&quot;mouseleave&quot;, hideTooltip);
  }

  function redraw() {
    drawPairPlot();
    drawTimePlot();
  }

  root.querySelector(&quot;#eyelink-epoch-select&quot;).addEventListener(&quot;change&quot;, event =&gt; {
    state.epoch = event.target.value;
    drawPairPlot();
  });
  root.querySelectorAll(&quot;.series-toggle&quot;).forEach(button =&gt; {
    button.addEventListener(&quot;click&quot;, () =&gt; {
      const series = button.dataset.series;
      state[series] = !state[series];
      button.setAttribute(&quot;aria-pressed&quot;, String(state[series]));
      drawPairPlot();
    });
  });

  const observer = new ResizeObserver(redraw);
  observer.observe(root);
  redraw();
})();
&lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-lucide&quot; async src=&quot;https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById(&quot;codex-visualization-lucide&quot;)
    ?.addEventListener(&quot;load&quot;, initialize, { once: true });
})();
&lt;/script&gt;
